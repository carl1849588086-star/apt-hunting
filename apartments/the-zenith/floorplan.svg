<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" width="760" height="690" style="background:#fbfcfb;font-family:system-ui,sans-serif">
  <!-- Floors -->
  <rect x="20" y="80" width="280" height="260" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="300" y="80" width="180" height="260" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="480" y="120" width="240" height="460" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="280" y="380" width="200" height="240" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="20" y="440" width="240" height="200" fill="#efe9df" stroke="#e2e2e0"/>
  <rect x="20" y="340" width="240" height="100" fill="#9aa3a8" stroke="#e2e2e0"/>
  <rect x="490" y="20" width="220" height="100" fill="#dfe3e4" stroke="#e2e2e0"/>

  <!-- External Walls -->
  <path d="M20,80 H480 V20 H720 V580 H440 V640 H20 Z" fill="none" stroke="#1d2a2f" stroke-width="12"/>
  
  <!-- Windows -->
  <line x1="70" y1="80" x2="250" y2="80" stroke="#2563eb" stroke-width="6"/>
  <line x1="330" y1="80" x2="450" y2="80" stroke="#2563eb" stroke-width="6"/>
  <line x1="510" y1="20" x2="690" y2="20" stroke="#2563eb" stroke-width="6"/>

  <!-- Interior Partitions -->
  <line x1="300" y1="80" x2="300" y2="340" stroke="#1d2a2f" stroke-width="8"/>
  <line x1="20" y1="340" x2="300" y2="340" stroke="#1d2a2f" stroke-width="8"/>
  <line x1="20" y1="440" x2="260" y2="440" stroke="#1d2a2f" stroke-width="8"/>
  <line x1="480" y1="80" x2="480" y2="380" stroke="#1d2a2f" stroke-width="8"/>

  <!-- Room Labels -->
  <text x="160" y="210" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">MASTER BEDROOM</text>
  <text x="160" y="235" font-size="12" fill="#6b6b70" text-anchor="middle">2.8 × 2.6 m</text>
  <text x="390" y="210" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">BEDROOM 2</text>
  <text x="390" y="235" font-size="12" fill="#6b6b70" text-anchor="middle">2.3 × 2.4 m</text>
  <text x="600" y="340" font-size="18" font-weight="700" fill="#1d1d1f" text-anchor="middle">LIVING ROOM</text>
  <text x="600" y="365" font-size="12" fill="#6b6b70" text-anchor="middle">3.2 × 3.6 m</text>
  <text x="380" y="490" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">DINING</text>
  <text x="140" y="540" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">KITCHEN</text>
  <text x="140" y="390" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">BATH</text>
  <text x="600" y="70" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">BALCONY</text>
</svg>