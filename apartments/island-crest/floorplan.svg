<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700" style="background:#fbfcfb;font-family:system-ui,sans-serif">
  <!-- Floors -->
  <rect x="20" y="80" width="310" height="280" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="330" y="80" width="190" height="280" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="520" y="120" width="260" height="480" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="330" y="360" width="190" height="260" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="20" y="460" width="280" height="200" fill="#efe9df" stroke="#e2e2e0"/>
  <rect x="20" y="360" width="280" height="100" fill="#9aa3a8" stroke="#e2e2e0"/>
  <rect x="530" y="10" width="240" height="110" fill="#dfe3e4" stroke="#e2e2e0"/>

  <!-- External Walls -->
  <path d="M20,80 H520 V10 H780 V600 H490 V660 H20 Z" fill="none" stroke="#1d2a2f" stroke-width="12"/>
  
  <!-- Windows -->
  <line x1="70" y1="80" x2="280" y2="80" stroke="#2563eb" stroke-width="6"/>
  <line x1="380" y1="80" x2="500" y2="80" stroke="#2563eb" stroke-width="6"/>
  <line x1="550" y1="10" x2="750" y2="10" stroke="#2563eb" stroke-width="6"/>

  <!-- Interior Partitions -->
  <line x1="330" y1="80" x2="330" y2="360" stroke="#1d2a2f" stroke-width="8"/>
  <line x1="20" y1="360" x2="330" y2="360" stroke="#1d2a2f" stroke-width="8"/>
  <line x1="20" y1="460" x2="300" y2="460" stroke="#1d2a2f" stroke-width="8"/>
  <line x1="520" y1="80" x2="520" y2="380" stroke="#1d2a2f" stroke-width="8"/>

  <!-- Room Labels -->
  <text x="175" y="210" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">MASTER BEDROOM</text>
  <text x="175" y="235" font-size="12" fill="#6b6b70" text-anchor="middle">3.1 × 2.8 m</text>
  <text x="420" y="210" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">BEDROOM 2</text>
  <text x="420" y="235" font-size="12" fill="#6b6b70" text-anchor="middle">2.4 × 2.5 m</text>
  <text x="650" y="340" font-size="18" font-weight="700" fill="#1d1d1f" text-anchor="middle">LIVING &amp; DINING</text>
  <text x="650" y="365" font-size="12" fill="#6b6b70" text-anchor="middle">3.4 × 4.8 m</text>
  <text x="160" y="560" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">KITCHEN</text>
  <text x="160" y="410" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">BATHROOM</text>
  <text x="650" y="65" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">BALCONY</text>
</svg>