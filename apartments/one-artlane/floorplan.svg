<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" style="background:#fbfcfb;font-family:system-ui,sans-serif">
  <!-- Floors -->
  <rect x="20" y="70" width="260" height="260" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="280" y="70" width="180" height="230" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="460" y="110" width="220" height="420" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="260" y="300" width="200" height="230" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="20" y="330" width="240" height="200" fill="#9aa3a8" stroke="#e2e2e0"/>
  <rect x="470" y="20" width="200" height="90" fill="#dfe3e4" stroke="#e2e2e0"/>

  <!-- External Walls -->
  <path d="M20,70 H460 V20 H680 V530 H420 V580 H20 Z" fill="none" stroke="#1d2a2f" stroke-width="12"/>
  
  <!-- Windows -->
  <line x1="60" y1="70" x2="240" y2="70" stroke="#2563eb" stroke-width="6"/>
  <line x1="320" y1="70" x2="440" y2="70" stroke="#2563eb" stroke-width="6"/>
  <line x1="490" y1="20" x2="660" y2="20" stroke="#2563eb" stroke-width="6"/>

  <!-- Interior Partitions -->
  <line x1="280" y1="70" x2="280" y2="300" stroke="#1d2a2f" stroke-width="8"/>
  <line x1="20" y1="330" x2="260" y2="330" stroke="#1d2a2f" stroke-width="8"/>
  <line x1="460" y1="70" x2="460" y2="340" stroke="#1d2a2f" stroke-width="8"/>

  <!-- Room Labels -->
  <text x="150" y="200" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">MASTER BEDROOM</text>
  <text x="150" y="225" font-size="12" fill="#6b6b70" text-anchor="middle">2.6 × 2.6 m</text>
  <text x="360" y="180" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">BEDROOM 2</text>
  <text x="360" y="205" font-size="12" fill="#6b6b70" text-anchor="middle">2.2 × 2.3 m</text>
  <text x="560" y="320" font-size="18" font-weight="700" fill="#1d1d1f" text-anchor="middle">LIVING ROOM</text>
  <text x="560" y="345" font-size="12" fill="#6b6b70" text-anchor="middle">3.0 × 3.4 m</text>
  <text x="360" y="440" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">OPEN KITCHEN</text>
  <text x="140" y="430" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">BATHROOM</text>
  <text x="570" y="65" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">BALCONY</text>
</svg>