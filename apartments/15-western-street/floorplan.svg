<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500" style="background:#fbfcfb;font-family:system-ui,sans-serif">
  <!-- Floors -->
  <rect x="20" y="60" width="380" height="320" fill="#e7dccb" stroke="#e2e2e0"/>
  <rect x="220" y="320" width="180" height="140" fill="#efe9df" stroke="#e2e2e0"/>
  <rect x="20" y="320" width="180" height="140" fill="#9aa3a8" stroke="#e2e2e0"/>
  <rect x="110" y="10" width="200" height="50" fill="#dfe3e4" stroke="#e2e2e0"/>

  <!-- External Walls -->
  <path d="M20,60 H110 V10 H310 V60 H400 V460 H260 V460 H20 Z" fill="none" stroke="#1d2a2f" stroke-width="12"/>
  
  <!-- Windows -->
  <line x1="130" y1="10" x2="290" y2="10" stroke="#2563eb" stroke-width="6"/>
  <line x1="330" y1="60" x2="390" y2="60" stroke="#2563eb" stroke-width="6"/>

  <!-- Interior Partitions -->
  <line x1="200" y1="320" x2="200" y2="460" stroke="#1d2a2f" stroke-width="8"/>

  <!-- Room Labels -->
  <text x="210" y="200" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">STUDIO LIVING &amp; SLEEPING</text>
  <text x="210" y="225" font-size="12" fill="#6b6b70" text-anchor="middle">3.2 × 3.5 m (213 sq ft)</text>
  <text x="310" y="380" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">KITCHENETTE</text>
  <text x="110" y="380" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">BATHROOM</text>
  <text x="210" y="38" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">BALCONY</text>
</svg>